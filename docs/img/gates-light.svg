<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Five proposed sub-tasks pass three gates in order. Two are refused at gate one because the work is already covered, one at gate two because it names no failure and goes back to the lead. Two clear all three gates and run as parallel sub-agents; a fan-out needs at least two." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Five proposed sub-tasks pass three gates in order. Two are refused at gate one because the work is already covered, one at gate two because it names no failure and goes back to the lead. Two clear all three gates and run as parallel sub-agents; a fan-out needs at least two.</title><defs><marker id="gates-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs><text x="110" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">Lead proposes</text><text x="110" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">5 sub-tasks</text><rect x="40" y="77" width="140" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="110.0" y="96.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">note-a</text><path d="M180,92 H770" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#gates-head-accent)"/><rect x="40" y="125" width="140" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="110.0" y="144.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">note-b</text><path d="M180,140 H770" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#gates-head-accent)"/><rect x="40" y="173" width="140" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="110.0" y="192.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">note-c</text><path d="M180,188 H476" fill="none" stroke="#8c959f" stroke-width="1.5"/><path d="M493,181 L507,195" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M493,195 L507,181" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><text x="516" y="192" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">names no failure: back to the lead</text><rect x="40" y="221" width="140" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="110.0" y="240.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">summary</text><path d="M180,236 H266" fill="none" stroke="#8c959f" stroke-width="1.5"/><path d="M283,229 L297,243" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M283,243 L297,229" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><text x="306" y="240" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">summary.md already exists</text><rect x="40" y="269" width="140" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="110.0" y="288.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">verify</text><path d="M180,284 H266" fill="none" stroke="#8c959f" stroke-width="1.5"/><path d="M283,277 L297,291" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M283,291 L297,277" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><text x="306" y="288" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">verification is the verifier&#x27;s job</text><rect x="264" y="72" width="12" height="232" rx="4" fill="#bc4c00" stroke="#bc4c00" stroke-width="1"/><text x="270" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#bc4c00">1 · Can someone else?</text><text x="270" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">covered · staffed · repeat · verifier</text><rect x="474" y="72" width="12" height="136" rx="4" fill="#bc4c00" stroke="#bc4c00" stroke-width="1"/><text x="480" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#bc4c00">2 · Should we?</text><text x="480" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">a named failure</text><rect x="684" y="72" width="12" height="88" rx="4" fill="#bc4c00" stroke="#bc4c00" stroke-width="1"/><text x="690" y="32" font-size="13" font-weight="700" text-anchor="middle" fill="#bc4c00">3 · Could we?</text><text x="690" y="50" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">tier · budget · cap · skill</text><rect x="770" y="77" width="170" height="78" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="855.0" y="113.0" font-size="13" font-weight="600" text-anchor="middle" fill="#bc4c00">2 legal</text><text x="855.0" y="129.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">parallel sub-agents</text><text x="855" y="176" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">a fan-out needs two or more</text></svg>
