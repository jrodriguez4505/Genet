<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Models only return JSON. Every change to the team, the tools or the budget is decided by code in the control plane and logged. There is no path from a model to the roster except through the schema check and the policy gates." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Models only return JSON. Every change to the team, the tools or the budget is decided by code in the control plane and logged. There is no path from a model to the roster except through the schema check and the policy gates.</title><defs><marker id="control-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="control-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="20" y="20" width="920" height="120" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/><text x="36" y="42" font-size="12" font-weight="600" text-anchor="start" fill="#59636e">MODEL PLANE  ·  any LLM  ·  output is untrusted</text><rect x="20" y="175" width="920" height="265" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5"/><text x="36" y="197" font-size="12" font-weight="600" text-anchor="start" fill="#59636e">CONTROL PLANE  ·  Genet kernel  ·  code</text><rect x="110" y="60" width="180" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="200.0" y="85.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lead model</text><text x="200.0" y="101.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">orchestrator</text><rect x="640" y="60" width="240" height="56" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="760.0" y="85.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Sub-agent models</text><text x="760.0" y="101.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">one per approved sub-task</text><rect x="110" y="215" width="180" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="200.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Schema check</text><text x="200.0" y="254.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">JSON only; extra keys refused</text><rect x="350" y="215" width="180" height="52" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="440.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#bc4c00">Policy gates</text><text x="440.0" y="254.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">3 checks, in order</text><rect x="590" y="215" width="150" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="665.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Roster</text><text x="665.0" y="254.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">written only here</text><rect x="790" y="215" width="130" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="855.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Tool allowlist</text><text x="855.0" y="254.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">per skill</text><rect x="790" y="300" width="130" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="855.0" y="323.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Sandbox</text><text x="855.0" y="339.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">read-only workspace</text><path d="M200,116 V215" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><text x="210" y="165" font-size="11" font-weight="400" text-anchor="start" fill="#59636e">JSON artifact</text><path d="M290,241 H350" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><text x="320" y="233" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">proposals</text><path d="M530,241 H590" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#control-head-accent)"/><text x="560" y="233" font-size="11" font-weight="600" text-anchor="middle" fill="#bc4c00">approved</text><path d="M680,215 V116" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><text x="672" y="165" font-size="11" font-weight="400" text-anchor="end" fill="#59636e">starts, isolated brief</text><path d="M850,116 V215" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><text x="858" y="165" font-size="11" font-weight="400" text-anchor="start" fill="#59636e">tool requests</text><path d="M855,267 V300" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><path d="M790,326 H765 V116" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#control-head-ink)"/><text x="757" y="300" font-size="11" font-weight="400" text-anchor="end" fill="#59636e">results</text><path d="M290,100 L596,213" fill="none" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#control-head-accent)"/><path d="M433,156 L447,170" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M433,170 L447,156" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><text x="470" y="152" font-size="11" font-weight="600" text-anchor="start" fill="#bc4c00">no direct write</text><rect x="40" y="372" width="880" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="56" y="389" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">Budget meter: every call counts calls, tokens and seconds; the run halts at the cap</text><rect x="40" y="404" width="880" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="56" y="421" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">Audit log: every gate record, tool call, verdict and halt</text></svg>
