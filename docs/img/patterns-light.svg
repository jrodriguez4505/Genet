<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-label="Three ways to staff the same task. A single agent uses one context. An always-split crew pays for a planner, workers and a merge on every task. Genet&#x27;s lead proposes sub-tasks and policy gates decide whether a fan-out happens at all; otherwise the lead works alone." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Three ways to staff the same task. A single agent uses one context. An always-split crew pays for a planner, workers and a merge on every task. Genet&#x27;s lead proposes sub-tasks and policy gates decide whether a fan-out happens at all; otherwise the lead works alone.</title><defs><marker id="patterns-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="patterns-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><line x1="20" y1="150" x2="940" y2="150" stroke="#d0d7de" stroke-width="1"/><line x1="20" y1="305" x2="940" y2="305" stroke="#d0d7de" stroke-width="1"/><text x="24" y="69" font-size="15" font-weight="700" text-anchor="start" fill="#1f2328">Single agent</text><text x="24" y="88" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">one context</text><rect x="200" y="60" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="232.0" y="79.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Task</text><rect x="880" y="60" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="912.0" y="79.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Answer</text><text x="24" y="219" font-size="15" font-weight="700" text-anchor="start" fill="#1f2328">Always-split crew</text><text x="24" y="238" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">every task fans out</text><rect x="200" y="210" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="232.0" y="229.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Task</text><rect x="880" y="210" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="912.0" y="229.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Answer</text><text x="24" y="389" font-size="15" font-weight="700" text-anchor="start" fill="#1f2328">Genet</text><text x="24" y="408" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">fans out only when</text><text x="24" y="423" font-size="12" font-weight="400" text-anchor="start" fill="#59636e">the gates approve</text><rect x="200" y="380" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="232.0" y="399.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Task</text><rect x="880" y="380" width="64" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="912.0" y="399.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Answer</text><rect x="310" y="53" width="200" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="410.0" y="72.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Agent</text><text x="410.0" y="88.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">reads, reasons, answers</text><path d="M264,75 H310" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M510,75 H880" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><text x="695" y="67" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">1 context holds everything</text><rect x="310" y="203" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="370.0" y="222.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Planner</text><text x="370.0" y="238.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">always splits</text><path d="M264,225 H310" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="490" y="162" width="120" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="550.0" y="181.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Worker</text><path d="M430,225 H460 V177 H490" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M610,177 H640 V225 H670" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="490" y="210" width="120" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="550.0" y="229.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Worker</text><path d="M430,225 H460 V225 H490" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M610,225 H640 V225 H670" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="490" y="258" width="120" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="550.0" y="277.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Worker</text><path d="M430,225 H460 V273 H490" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M610,273 H640 V225 H670" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="670" y="203" width="110" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="725.0" y="229.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Merge</text><path d="M780,225 H880" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="310" y="373" width="120" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="370.0" y="392.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lead</text><text x="370.0" y="408.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">proposes sub-tasks</text><rect x="470" y="373" width="110" height="44" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="525.0" y="392.0" font-size="13" font-weight="600" text-anchor="middle" fill="#bc4c00">Policy gates</text><text x="525.0" y="408.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">3 checks</text><path d="M264,395 H310" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M430,395 H470" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="613" y="310" width="124" height="80" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/><text x="675" y="404" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">isolated contexts</text><rect x="625" y="316" width="100" height="28" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="675.0" y="334.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Sub-agent</text><path d="M725,330 H742 V350 H760" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><rect x="625" y="356" width="100" height="28" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="675.0" y="374.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Sub-agent</text><path d="M725,370 H742 V350 H760" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M580,395 H600 V330 H625" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#patterns-head-accent)"/><path d="M600,330 V370 H625" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#patterns-head-accent)"/><text x="595" y="318" font-size="11" font-weight="600" text-anchor="end" fill="#bc4c00">2+ approved</text><rect x="760" y="328" width="90" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="805.0" y="347.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lead</text><text x="805.0" y="363.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">merges</text><path d="M850,350 H865 V389 H880" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><path d="M580,395 H600 V450 H625" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/><text x="595" y="472" font-size="11" font-weight="400" text-anchor="end" fill="#59636e">otherwise</text><rect x="625" y="433" width="225" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="737.5" y="454.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lead works alone</text><path d="M850,450 H865 V401 H880" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#patterns-head-ink)"/></svg>
