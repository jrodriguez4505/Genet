<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="One sub-agent&#x27;s reply is malformed. Its part goes back to the lead, who merges the other results, covers the part and hands the product to the verifier. After any failure the kernel writes a blameless review, and its lessons reach every brief in the next run. Authority violations, budget halts and crashes still stop the run at once." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>One sub-agent&#x27;s reply is malformed. Its part goes back to the lead, who merges the other results, covers the part and hands the product to the verifier. After any failure the kernel writes a blameless review, and its lessons reach every brief in the next run. Authority violations, budget halts and crashes still stop the run at once.</title><defs><marker id="ownership-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><marker id="ownership-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ownership-head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><text x="40" y="32" font-size="12" font-weight="600" text-anchor="start" fill="#59636e">ONE RUN</text><rect x="40" y="85" width="130" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="105.0" y="107.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lead</text><text x="105.0" y="123.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">proposes · decides</text><path d="M170,110 H200 V60 H230" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><rect x="230" y="43" width="140" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.0" y="57.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">part-a</text><text x="300.0" y="73.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">sub-agent</text><path d="M170,110 H200 V110 H230" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><rect x="230" y="93" width="140" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.0" y="107.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">part-b</text><text x="300.0" y="123.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">sub-agent</text><path d="M170,110 H200 V160 H230" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><rect x="230" y="143" width="140" height="34" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="300.0" y="157.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">part-c</text><text x="300.0" y="173.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">sub-agent</text><rect x="560" y="80" width="160" height="60" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="640.0" y="107.0" font-size="13" font-weight="600" text-anchor="middle" fill="#bc4c00">Lead merges</text><text x="640.0" y="123.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">and covers part-b</text><path d="M370,60 H520 V98 H560" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><path d="M370,160 H520 V122 H560" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><path d="M385,103 L399,117" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M385,117 L399,103" stroke="#bc4c00" stroke-width="2.5" stroke-linecap="round"/><path d="M410,110 H560" fill="none" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ownership-head-accent)"/><text x="462" y="102" font-size="11" font-weight="600" text-anchor="middle" fill="#bc4c00">its part goes back</text><text x="392" y="136" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">reply malformed</text><rect x="780" y="85" width="140" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="850.0" y="107.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Verifier</text><text x="850.0" y="123.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">checks the product</text><path d="M720,110 H780" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><line x1="20" y1="205" x2="940" y2="205" stroke="#d0d7de" stroke-width="1"/><text x="40" y="232" font-size="12" font-weight="600" text-anchor="start" fill="#59636e">AFTER ANY FAILURE</text><path d="M640,140 V190 H340 V248" fill="none" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#ownership-head-accent)"/><rect x="230" y="248" width="220" height="54" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/><text x="340.0" y="272.0" font-size="13" font-weight="600" text-anchor="middle" fill="#bc4c00">Team review</text><text x="340.0" y="288.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">what failed · each part · what was done</text><rect x="500" y="248" width="200" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="600.0" y="272.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Lessons</text><text x="600.0" y="288.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">fixed sentences, at most 10</text><rect x="750" y="248" width="170" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="835.0" y="272.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Next run</text><text x="835.0" y="288.0" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">every brief reads them</text><path d="M450,275 H500" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><path d="M700,275 H750" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ownership-head-ink)"/><path d="M835,302 V338 H105 V135" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ownership-head-line)"/><text x="470" y="332" font-size="11" font-weight="400" text-anchor="middle" fill="#59636e">the next run starts with what this one learned</text></svg>
