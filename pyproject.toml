[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskorg"
version = "0.1.0"
description = "Genet: small multi-agent runtime. Authority in the graph, not the prompt."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "John Rodriguez" }]
keywords = ["agents", "multi-agent", "orchestration", "llm"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taskorg = "taskorg.cli:main"

[tool.setuptools.packages.find]
include = ["taskorg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
